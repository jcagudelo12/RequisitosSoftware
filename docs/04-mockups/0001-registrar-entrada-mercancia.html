<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 0001 · Registrar entrada de mercancía · Stock Central</title>
<style>
:root{--sidebar-bg:#1b2533;--sidebar-text:#c9d1dc;--sidebar-muted:#7d8899;--sidebar-active:#2b3a4f;--brand:#f59e0b;--bg:#f3f4f6;--surface:#ffffff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--primary:#2563eb;--primary-hover:#1d4ed8;--success:#15803d;--success-bg:#dcfce7;--warning:#b45309;--warning-bg:#fef3c7;--danger:#b91c1c;--danger-bg:#fee2e2;--info:#1d4ed8;--info-bg:#dbeafe;--radius:8px;--radius-sm:6px;--shadow:0 1px 2px rgba(16,24,40,.06);--chrome-bg:#312e81;--chrome-text:#ffffff}
*,*::before,*::after{box-sizing:border-box}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);overflow-x:hidden}
h1,h2,h3,h4,p,dl,dd{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mk-chrome :focus-visible,.sidebar :focus-visible,.toast :focus-visible{outline-color:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}.strong{font-weight:600}
/* ---- Chrome del mockup (NO es parte del producto) ---- */
.mk-chrome{position:fixed;top:0;left:0;right:0;height:44px;background:var(--chrome-bg);color:var(--chrome-text);display:flex;align-items:center;gap:16px;padding:0 16px;z-index:200;font-size:13px;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.mk-chrome>*{flex:none}
.mk-tag{font-weight:700;letter-spacing:.03em}
.mk-chrome a{color:#fff}
.mk-chrome label{display:flex;align-items:center;gap:6px;font-size:12px}
.mk-chrome select{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 8px;font-size:13px;max-width:230px}
.mk-chrome select option{color:#111827;background:#fff}
.mk-spacer{flex:1 0 0!important}
.mk-chrome{scrollbar-width:none}.mk-chrome::-webkit-scrollbar{display:none}
.mk-notes-btn{background:#fff;color:var(--chrome-bg);border:0;border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer}
/* ---- Sidebar ---- */
.sidebar{position:fixed;top:44px;left:0;bottom:0;width:232px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;z-index:60;overflow-y:auto;overflow-x:hidden;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.brand-logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#1b2533;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.sb-nav{flex:1;padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.sb-group{font-size:11px;letter-spacing:.08em;color:var(--sidebar-muted);padding:16px 10px 6px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--sidebar-text);text-decoration:none;font-size:13px}
.sb-item:hover{background:rgba(255,255,255,.06)}
.sb-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
.sb-item[aria-disabled=true]{cursor:not-allowed}
.sb-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--sidebar-muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none;display:inline-block}
.scrim{display:none}
/* ---- Topbar y layout ---- */
.main{margin-left:232px;padding-top:44px;min-width:0}
.topbar{position:sticky;top:44px;z-index:30;height:64px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.tb-menu.btn{display:none}
.tb-title{min-width:0;flex:1 1 auto}
.tb-title strong{display:block;font-size:16px;line-height:1.2}
.tb-sub{font-size:12px;color:var(--muted)}
.tb-search{position:relative;flex:0 1 340px;min-width:0}
.tb-search .ico{position:absolute;left:11px;top:11px;color:var(--muted)}
.tb-search input{width:100%;height:36px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;font-size:13px}
.tb-sede{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius);padding:0 12px;height:36px;font-size:13px;white-space:nowrap}
.tb-user{display:flex;gap:10px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:#e0e7ff;color:#3730a3;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.tb-user-text strong{display:block;font-size:13px;line-height:1.2;white-space:nowrap}
.tb-user-text span{font-size:11px;color:var(--muted);white-space:nowrap}
.content{padding:24px;min-width:0;outline:none}
.app.bare .sidebar,.app.bare .topbar{display:none}
.app.bare .main{margin-left:0}
.page-head{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.crumb{font-size:12px;color:var(--muted)}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{text-decoration:underline}
.h1{font-size:22px;font-weight:700;line-height:1.25}
.page-sub{color:var(--muted);font-size:13px}
.title-row{display:flex;gap:12px;align-items:center;margin-top:6px}
/* ---- Botones ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--radius-sm);border:1px solid transparent;font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;background:#fff;color:var(--text)}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:#fff;border-color:#d1d5db}.btn-secondary:hover{background:#f9fafb}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{background:#e5e7eb;color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#991b1b}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#166534}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn-icon{width:36px;padding:0}.btn-sm.btn-icon{width:30px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.link-btn{background:none;border:0;padding:0;color:inherit;font-weight:600;cursor:pointer;text-align:left}
.link-btn:hover{color:var(--primary);text-decoration:underline}
/* ---- Card, KPI ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;flex-wrap:wrap}
.card-head-l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card-body{padding:20px}
.card-title{font-size:15px;font-weight:700}
.card-sub{font-size:12px;color:var(--muted)}
.overline{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:16px 20px;min-width:0}
.kpi-label{font-size:12px;color:var(--muted)}
.kpi-value{font-size:28px;font-weight:700;line-height:1.2;margin:4px 0 2px}
.kpi-value.is-danger{color:var(--danger)}.kpi-value.is-warning{color:var(--warning)}
.kpi-note{font-size:12px;color:var(--muted)}
.kpi-note.is-success{color:var(--success)}.kpi-note.is-danger{color:var(--danger)}.kpi-note.is-warning{color:var(--warning)}
/* ---- Tabla ---- */
.table-wrap{overflow-x:auto;max-width:100%;position:relative}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{background:#f9fafb;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);border-top:1px solid var(--border);white-space:nowrap}
.table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.table tbody tr:last-child td{border-bottom:0}
.table tr.is-link{cursor:pointer}.table tr.is-link:hover{background:#f9fafb}
/* ---- Badge ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5}
.badge-success{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-danger{background:var(--danger-bg);color:var(--danger)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:#e5e7eb;color:#374151}
/* ---- Formularios ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.label{font-size:12px;font-weight:600;color:#374151}
.req{color:var(--danger)}.opt{font-weight:400;color:var(--muted)}
.input{width:100%;height:36px;padding:0 12px;border:1px solid #d1d5db;border-radius:var(--radius-sm);background:#fff;font-size:13px;min-width:0}
textarea.input{height:auto;padding:8px 12px;min-height:90px;resize:vertical}
.input:disabled,.input[readonly]{background:#f3f4f6;color:var(--muted);cursor:not-allowed}
.input.is-error{border-color:var(--danger);background:#fff5f5;box-shadow:0 0 0 1px var(--danger)}
.field-help{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.field-error{font-size:12px;color:var(--danger);margin-top:4px}
.form-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #d1d5db;border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:0 12px;height:34px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--info-bg);color:var(--info)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 16px}
.kv dt{color:var(--muted);font-size:12.5px}.kv dd{font-weight:600}
/* ---- Modal, drawer ---- */
.overlay{position:fixed;inset:44px 0 0 0;background:rgba(17,24,39,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:520px;max-height:100%;overflow:auto}
.modal-head{padding:20px 24px 0}
.modal-title{font-size:17px;font-weight:700}
.modal-body{padding:12px 24px 4px;color:#374151}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px 20px;flex-wrap:wrap}
.overlay-right{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{background:#fff;width:460px;max-width:100%;height:100%;box-shadow:-10px 0 30px rgba(0,0,0,.2);overflow:auto;display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:20px 24px;border-bottom:1px solid var(--border)}
.drawer-body{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
/* ---- Toast ---- */
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:#111827;color:#fff;border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 25px rgba(0,0,0,.25);font-size:13px;min-width:260px;max-width:440px;border-left:4px solid #60a5fa}
.toast-success{border-left-color:#22c55e}.toast-warning{border-left-color:#f59e0b}
.toast-msg{flex:1}
.toast-link,.toast-x{background:none;border:0;cursor:pointer;color:#93c5fd;font-weight:600;padding:0}
.toast-x{color:#d1d5db;font-size:16px;line-height:1}
/* ---- Estados ---- */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 20px;color:var(--muted)}
.empty-state .es-icon{width:48px;height:48px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;color:var(--muted)}
.empty-state .es-icon .ico{width:24px;height:24px}
.empty-state h2,.empty-state h3{color:var(--text);font-size:16px;font-weight:700}
.empty-state p{max-width:440px}
.empty-state .btn{margin-top:8px}
.skeleton{display:block;border-radius:6px;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 37%,#e5e7eb 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite}
.sk-line{height:12px;margin:6px 0}.sk-big{height:30px;width:60%;margin:10px 0}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.sidebar,.notes{transition:none}}
.alert-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);border:1px solid;font-size:13px;margin-bottom:16px}
.alert-banner .ico{margin-top:2px}
.alert-body{flex:1;min-width:0}
.alert-actions{margin-left:auto;display:flex;gap:8px;flex:none}
.alert-info{background:var(--info-bg);color:var(--info);border-color:#bfdbfe}
.alert-warning{background:var(--warning-bg);color:var(--warning);border-color:#fde68a}
.alert-danger{background:var(--danger-bg);color:var(--danger);border-color:#fecaca}
/* ---- Panel de notas del mockup ---- */
.notes{position:fixed;top:44px;right:0;bottom:0;width:min(460px,100vw);background:#fff;border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.14);z-index:180;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s;overflow-y:auto;font-size:13px}
.notes.open{transform:none;visibility:visible}
.notes-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:1}
.notes-head h2{font-size:15px}
.notes-body{padding:4px 16px 24px}
.notes-body section{padding:14px 0;border-bottom:1px solid var(--border)}
.notes-body h3{font-size:13.5px;margin-bottom:8px;color:var(--chrome-bg)}
.notes-body ul{margin:6px 0 0;padding-left:18px}.notes-body li{margin:3px 0}
.notes-body table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.notes-body th,.notes-body td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
.notes-body th{background:#f9fafb}
.notes-body td.grp{background:#eef2ff;font-weight:700;color:var(--chrome-bg)}
.notes-body .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.notes-body .node{background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.notes-body .arrow{color:var(--muted)}
.notes-body .tag{display:inline-block;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;font-weight:700;font-size:11.5px}
/* ---- Responsive ---- */
@media (max-width:1023px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:768px) and (max-width:1279px){
 .sidebar{width:64px}
 .brand-text,.sb-label,.sb-foot-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
 .sb-group{font-size:0;padding:0;height:1px;margin:10px 8px;background:rgba(255,255,255,.12)}
 .sb-item{justify-content:center;padding:10px}
 .brand{justify-content:center;padding:18px 0 12px}
 .sb-foot{justify-content:center}
 .main{margin-left:64px}
 .form-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:767px){
 .mk-long{display:none}
 .mk-lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
 .mk-chrome{gap:10px;padding:0 10px}
 .mk-chrome select{max-width:84px;font-size:12px;padding:3px 4px}
 .sidebar{transform:translateX(-100%);box-shadow:none}
 .nav-open .sidebar{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
 .nav-open .scrim{display:block;position:fixed;inset:44px 0 0 0;background:rgba(17,24,39,.5);z-index:55}
 .main{margin-left:0}
 .tb-menu.btn{display:inline-flex}
 .topbar{padding:0 12px;gap:10px}
 .tb-search,.tb-user-text,.tb-sede{display:none}
 .content{padding:16px 12px}
 .kpis{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}
 .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:8px}
 .h1{font-size:19px}
 .mk-tag{max-width:none}
 .modal-foot .btn{flex:1}
 .alert-banner{flex-wrap:wrap}.alert-actions{margin-left:0}
}

.btn-icon.btn-ghost{color:var(--muted)}
.search-wrap{position:relative;width:320px;max-width:100%}
.search-wrap>.ico{position:absolute;left:10px;top:10px;color:var(--muted)}
.search-wrap .input{padding-left:32px}
.head-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dropdown{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 25px rgba(0,0,0,.18);z-index:20;padding:14px;font-size:13px}
.dropdown p+p{margin-top:6px}
.t-form{min-width:1020px}
.t-form td{vertical-align:top;padding-top:14px;padding-bottom:14px}
.t-form td:not(.cell-in){padding-top:22px}
.t-form td.cell-in{min-width:140px}
.detail-foot{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px 24px}
.totals{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.total{font-size:22px;font-weight:700}
.card.has-error{border-color:#fca5a5;box-shadow:0 0 0 1px #fca5a5}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 16px}
.toolbar .input{width:auto;min-width:170px}
.t-list{min-width:880px}
.center-card{max-width:560px;margin:32px auto;text-align:center;padding:32px 28px}
.center-card .big-ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}
.center-card .big-ico .ico{width:28px;height:28px}
.big-ico.ok{background:var(--success-bg);color:var(--success)}
.big-ico.bad{background:var(--danger-bg);color:var(--danger)}
.big-ico.warn{background:var(--warning-bg);color:var(--warning)}
.center-card h1{font-size:20px;margin-bottom:8px}
.center-card .kv{text-align:left;margin:18px 0 4px;padding:16px;background:#f9fafb;border-radius:var(--radius)}
.center-card .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.bare-wrap{min-height:calc(100vh - 44px);display:grid;place-items:center;padding:16px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}
.sum div{background:#f9fafb;border-radius:var(--radius);padding:10px 12px}
.sum span{display:block;font-size:11.5px;color:var(--muted)}.sum strong{font-size:14px}
@media (max-width:767px){.sum{grid-template-columns:1fr 1fr}.search-wrap{width:100%}.head-tools{width:100%}}
.kv-4{grid-template-columns:150px minmax(0,1fr) 150px minmax(0,1fr)}
@media (max-width:1023px){.kv-4{grid-template-columns:150px minmax(0,1fr)}}
@media (max-width:767px){.kv-4{grid-template-columns:1fr}}
.t-list td:first-child a{white-space:nowrap;text-decoration:none;color:var(--primary)}.t-list td:nth-child(2){white-space:nowrap}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-sq" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>

<script>
/* Motor del mockup: SOLO cambia de pantalla/estado. Sin lógica de negocio. */
(function(){
'use strict';
var C;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var flow=false,timer=null,params={},lastScreen=null;
window.ic=function(n,c){return '<svg class="ico '+(c||'')+'" aria-hidden="true" focusable="false"><use href="#i-'+n+'"/></svg>'};
window.crumb=function(items){return '<nav class="crumb" aria-label="Ruta de navegación">'+items.map(function(x,i){var last=i===items.length-1;if(typeof x==='string')return last?'<span aria-current="page">'+x+'</span>':'<span>'+x+'</span>';return '<a href="'+(x[2]||'#')+'"'+(x[1]?' data-go="'+x[1]+'"':'')+'>'+x[0]+'</a>'}).join(' / ')+'</nav>'};
window.modal=function(o){return '<div class="overlay'+(o.right?' overlay-right':'')+'"'+(o.esc?' data-esc="'+o.esc+'"':'')+'><div class="'+(o.right?'drawer':'modal')+'" role="dialog" aria-modal="true" aria-labelledby="'+o.id+'-t" tabindex="-1"'+(o.noDesc?'':' aria-describedby="'+o.id+'-d"')+'>'+o.inner+'</div></div>'};
window.withOverlay=function(bg,ov){return '<div inert aria-hidden="true">'+bg+'</div>'+ov};
window.statesTable=function(){
  var h='<table><thead><tr><th>Estado</th><th>Cuándo ocurre</th><th>Cómo verlo</th></tr></thead><tbody>';
  Object.keys(C.screens).forEach(function(k){var sc=C.screens[k];
    h+='<tr><td class="grp" colspan="3">Pantalla «'+sc.label+'»</td></tr>';
    sc.states.forEach(function(st){h+='<tr><td>'+st[1]+'</td><td>'+(st[2]||'')+'</td><td><a href="#pantalla='+k+'&estado='+st[0]+'">#pantalla='+k+'&amp;estado='+st[0]+'</a></td></tr>'});
  });
  return h+'</tbody></table>';
};
function parse(){
  var p=new URLSearchParams(location.hash.replace(/^#/,''));
  var s=p.get('pantalla');if(!C.screens[s])s=C.start;
  var st=C.screens[s].states,e=p.get('estado');
  if(!st.some(function(x){return x[0]===e}))e=st[0][0];
  params={};p.forEach(function(v,k){if(k!=='pantalla'&&k!=='estado')params[k]=v});
  return {s:s,e:e};
}
window.go=function(t,o){
  var i=t.indexOf('&'),extra=i<0?'':t.slice(i),main=i<0?t:t.slice(0,i),a=main.split(':'),s=a[0],e=a[1];
  if(!C.screens[s])return;
  if(!e)e=C.screens[s].states[0][0];
  var h='#pantalla='+s+'&estado='+e+extra;
  flow=!!(o&&o.flow);
  if(location.hash===h)render();else location.hash=h;
};
window.toast=function(msg,o){
  o=o||{};var box=$('#toasts'),d=document.createElement('div');
  d.className='toast toast-'+(o.type||'info');
  d.innerHTML=ic(o.type==='success'?'check':'info')+'<div class="toast-msg"></div>'+(o.action?'<button type="button" class="toast-link" data-toast="'+o.action.toast+'">'+o.action.label+'</button>':'')+'<button type="button" class="toast-x" aria-label="Cerrar notificación">&times;</button>';
  $('.toast-msg',d).textContent=msg;
  box.appendChild(d);
  while(box.children.length>3)box.removeChild(box.firstChild);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},7000);
};
function setNotes(open){
  $('#notes').classList.toggle('open',open);
  $('#notesBtn').setAttribute('aria-expanded',open?'true':'false');
  if(open)$('#notesClose').focus();else if(document.activeElement&&$('#notes').contains(document.activeElement))$('#notesBtn').focus();
}
function setNav(open){
  $('#app').classList.toggle('nav-open',open);
  $('#navBtn').setAttribute('aria-expanded',open?'true':'false');
}
function render(){
  var wasFlow=flow;flow=false;clearTimeout(timer);
  var r=parse(),s=r.s,e=r.e,sc=C.screens[s],out=sc.render(e,params,s)||{};
  var app=$('#app');app.classList.toggle('bare',!!out.bare);setNav(false);
  $('#view').innerHTML=out.html||'';
  var u=out.user||C.user;
  $('#tbTitle').textContent=out.title||C.title;$('#tbSub').textContent=out.sub||'';
  $('#tbSede').textContent=out.sede||C.sede;
  $('#tbAv').textContent=u.ini;$('#tbName').textContent=u.name;$('#tbRole').textContent=u.role;
  var stLabel='';
  sc.states.forEach(function(x){if(x[0]===e)stLabel=x[1]});
  $('#selScreen').value=s;
  $('#selState').innerHTML=sc.states.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>'}).join('');
  $('#selState').value=e;
  document.title='Mockup '+C.num+' · '+sc.label+' · '+stLabel;
  var ov=$('#view .overlay'),dlg=ov&&$('[role="dialog"]',ov);
  $$('.sidebar,.topbar').forEach(function(x){if(ov)x.setAttribute('inert','');else x.removeAttribute('inert')});
  if(dlg){var f=$('[data-autofocus]',dlg)||$('button:not([disabled]),a[href],input:not([disabled]),textarea,select',dlg)||dlg;f.focus()}
  else if(wasFlow){var h=$('#view h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
  if(wasFlow||lastScreen!==s)window.scrollTo(0,0);
  lastScreen=s;
  $('#live').textContent='Pantalla '+sc.label+', estado '+stLabel;
  if(out.after)out.after();
  var au=sc.auto&&sc.auto(e);
  if(au&&wasFlow)timer=setTimeout(function(){go(au.to,{flow:true})},au.ms);
}
document.addEventListener('click',function(ev){
  var t=ev.target;
  var dis=t.closest('[aria-disabled="true"]');
  if(dis){ev.preventDefault();toast(dis.getAttribute('title')||'Fuera del alcance de este mockup');return}
  if(t.closest('.toast-x')){var d=t.closest('.toast');d.parentNode.removeChild(d);return}
  if(t.closest('.sb-item'))setNav(false);
  if(t.closest('#notes a[href^="#"]'))setNotes(false);
  var ovl=t.closest('.overlay[data-esc]');if(ovl&&t===ovl){go(ovl.getAttribute('data-esc'),{flow:true});return}
  var el=t.closest('[data-toast],[data-go],[data-act]');if(!el)return;
  if(el.tagName==='TR'&&t.closest('input,select,textarea'))return;
  ev.preventDefault();
  if(el.hasAttribute('data-toast'))toast(el.getAttribute('data-toast'),{type:el.getAttribute('data-toast-type')||'info'});
  if(el.hasAttribute('data-act')&&C.actions)C.actions[el.getAttribute('data-act')](el);
  else if(el.hasAttribute('data-go'))go(el.getAttribute('data-go'),{flow:true});
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){
    if($('#notes').classList.contains('open')){setNotes(false);return}
    if($('#app').classList.contains('nav-open')){setNav(false);return}
    var ov=$('#view .overlay[data-esc]');if(ov)go(ov.getAttribute('data-esc'),{flow:true});
  }else if(ev.key==='Tab'){
    var o=$('#view .overlay');if(!o)return;
    var f=$$('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex="0"]',o);
    if(!f.length){ev.preventDefault();return}
    var first=f[0],last=f[f.length-1],a=document.activeElement;
    if(!o.contains(a)){ev.preventDefault();first.focus()}
    else if(ev.shiftKey&&a===first){ev.preventDefault();last.focus()}
    else if(!ev.shiftKey&&a===last){ev.preventDefault();first.focus()}
  }
});
window.initMock=function(cfg){
  C=window.MOCK=cfg;
  $('#selScreen').innerHTML=Object.keys(C.screens).map(function(k){return '<option value="'+k+'">'+C.screens[k].label+'</option>'}).join('');
  $('#selScreen').addEventListener('change',function(){location.hash='#pantalla='+this.value+'&estado='+C.screens[this.value].states[0][0]});
  $('#selState').addEventListener('change',function(){location.hash='#pantalla='+$('#selScreen').value+'&estado='+this.value});
  $('#notesBtn').addEventListener('click',function(){setNotes(!$('#notes').classList.contains('open'))});
  $('#notesClose').addEventListener('click',function(){setNotes(false)});
  $('#navBtn').addEventListener('click',function(){setNav(!$('#app').classList.contains('nav-open'))});
  $('#scrim').addEventListener('click',function(){setNav(false)});
  $('#notesBody').innerHTML=typeof C.notes==='function'?C.notes():C.notes;
  window.addEventListener('hashchange',render);
  render();
};
})();
